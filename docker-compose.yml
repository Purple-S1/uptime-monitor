# Uptime Monitor - alle containers en hoe ze samenwerken.
# Starten: docker compose up -d     Stoppen: docker compose down
# Wachtwoorden en instellingen staan in het bestand .env

services:
  # PostgreSQL-database waarin alle controles worden opgeslagen
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data                        # data blijft bewaard
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # maakt de tabel aan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
