# Uptime Monitor - alle containers en hoe ze samenwerken.
# Starten: docker compose up -d     Stoppen: docker compose down
# Wachtwoorden en instellingen staan in het bestand .env

services:
  # PostgreSQL-database waarin alle controles worden opgeslagen
  db:
    image: postgres:17.12-alpine
    restart: unless-stopped                                     # na een crash of herstart van de Mac weer starten
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data                        # data blijft bewaard
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # maakt de tabel aan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # Python-programma dat de websites controleert en het resultaat opslaat
  checker:
    build: ./checker
    restart: unless-stopped                                     # na een crash of herstart van de Mac weer starten
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHECK_INTERVAL: ${CHECK_INTERVAL}
    volumes:
      - ./config/websites.txt:/config/websites.txt:ro           # lijst met websites
    depends_on:
      db:
        condition: service_healthy                              # wacht tot de database klaar is
    networks: [backend]

  # Statuspagina (Flask + Gunicorn), te openen op http://localhost:8000
  web:
    build: ./web
    restart: unless-stopped                                     # na een crash of herstart van de Mac weer starten
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DREMPEL_MS: 1000
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]

  # Grafana: dashboard met grafieken, te openen op http://localhost:3000
  grafana:
    image: grafana/grafana:13.0.13
    restart: unless-stopped                                     # na een crash of herstart van de Mac weer starten
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"                         # dashboard bekijken zonder inloggen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer                        # ...maar alleen kijken, niet aanpassen
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/uptime.json
      POSTGRES_DB: ${POSTGRES_DB}                               # gebruikt in de datasource
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]

# Twee netwerken: 'frontend' voor wat de gebruiker ziet, 'backend' voor de database.
# De database zit alleen in 'backend' en heeft geen poort naar buiten.
networks:
  frontend:
  backend:

volumes:
  db-data:
  grafana-data:
